<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine's Surprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'v-red': '#6b1317',
            'v-bg': '#ffdada',
          },
          fontFamily: {
            romantic: ['"Great Vibes"', 'cursive'],
            sans: ['Inter', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 1.2s ease-in-out forwards',
            'float': 'float 12s ease-in-out infinite',
            'bounce-slow': 'bounce 4s ease-in-out infinite',
            'sparkle': 'sparkle 2s ease-in-out infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(15px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            float: {
              '0%, 100%': { transform: 'translate(0, 0)' },
              '50%': { transform: 'translate(30px, -30px)' },
            },
            sparkle: {
              '0%, 100%': { opacity: 0, transform: 'scale(0)' },
              '50%': { opacity: 1, transform: 'scale(1)' },
            }
          }
        },
      },
    };
  </script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #ffdada;
    }
    
    .transition-all {
      transition-timing-function: ease-in-out !important;
      transition-duration: 1000ms !important;
    }

    .floating-cloud {
      animation: float 15s ease-in-out infinite;
    }
    
    .perspective-1000 {
      perspective: 1500px;
    }

    .rotate-x-open {
      transform: rotateX(-120deg);
    }
    
    .paper-texture {
      background-color: #fffaf0;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(107, 19, 23, 0.02) 0%, transparent 80%),
        repeating-linear-gradient(rgba(0,0,0,0.01) 0px, rgba(0,0,0,0.01) 1px, transparent 1px, transparent 2px),
        repeating-linear-gradient(90deg, rgba(0,0,0,0.01) 0px, rgba(0,0,0,0.01) 1px, transparent 1px, transparent 2px);
      box-shadow: inset 0 0 50px rgba(107, 19, 23, 0.05), 0 10px 30px rgba(0,0,0,0.1);
    }

    /* Custom Scrollbar for the letter if needed */
    .paper-texture::-webkit-scrollbar {
      width: 4px;
    }
    .paper-texture::-webkit-scrollbar-thumb {
      background: rgba(107, 19, 23, 0.2);
      border-radius: 10px;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</body>
</html>
